<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Billing | VASAIKAR BAKALA</title>

    <link rel="stylesheet" href="css/style.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>


<body>

    <!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">

        🏪

        <h2>VASAIKAR BAKALA</h2>

    </div>

    <ul>

        <li onclick="location.href='dashboard.html'">

            <i class="fa-solid fa-chart-line"></i>

            Dashboard

        </li>

        <li onclick="location.href='inventory.html'">

            <i class="fa-solid fa-box"></i>

            Inventory

        </li>

        <li class="active">

            <i class="fa-solid fa-cart-shopping"></i>

            Billing

        </li>

        <li onclick="location.href='customer.html'">

            <i class="fa-solid fa-users"></i>

            Customers

        </li>

        <li onclick="location.href='reports.html'">

            <i class="fa-solid fa-chart-column"></i>

            Reports

        </li>

    </ul>

<button type="button" id="logoutBtn" class="logout-btn">
    <i class="fas fa-sign-out-alt"></i>
    <span>Logout</span>
</button>

</aside>



    <!-- =====================================================
     MAIN CONTENT
===================================================== -->

    <main class="main">


        <h1>🧾 Billing</h1>


        <!-- =================================================
         ADD PRODUCT
    ================================================== -->

        <div class="form-card">

            <h2>Create Bill</h2>


            <!-- PRODUCT SEARCH -->

            <div class="form-group">

                <label for="productSearch">
                    Search Product
                </label>

                <input type="text" id="productSearch" placeholder="🔍 Search product..." autocomplete="off">

            </div>


            <!-- PRODUCT SELECT -->

            <div class="form-group">

                <label for="productSelect">
                    Product
                </label>

                <select id="productSelect">

                    <option value="">
                        Select Product
                    </option>

                </select>

            </div>


            <!-- ===============================
     QUANTITY
================================ -->

            <div class="form-group">

                <label for="qty">
                    Quantity
                </label>

                <div style="
        display: flex;
        gap: 10px;
        align-items: center;
    ">

                    <input type="number" id="qty" min="0.001" step="0.001" placeholder="Enter quantity"
                        style="flex: 1;">

                    <select id="qtyUnit" style="width: 130px;">

                        <option value="">
                            Unit
                        </option>

                        <option value="g">
                            Gram (g)
                        </option>

                        <option value="kg">
                            Kilogram (kg)
                        </option>

                        <option value="ml">
                            Millilitre (ml)
                        </option>

                        <option value="L">
                            Litre (L)
                        </option>

                        <option value="piece">
                            Piece
                        </option>

                    </select>

                </div>

            </div>


            <button class="add-btn" onclick="addToBill()">
                + Add to Bill
            </button>

        </div>



        <!-- =================================================
         BILL TABLE
    ================================================== -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>No.</th>

                        <th>Product</th>

                        <th>Price</th>

                        <th>Quantity</th>

                        <th>Total</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="billBody">

                </tbody>

            </table>

        </div>



        <!-- =================================================
         PAYMENT SECTION
    ================================================== -->

        <div class="form-card">

            <h2>Payment Details</h2>


            <!-- PAYMENT METHOD -->

            <div class="form-group">

                <label for="paymentMethod">
                    Payment Method
                </label>


                <select id="paymentMethod" onchange="handlePaymentMethod()">

                    <option value="">
                        Select Payment Method
                    </option>


                    <option value="cash">
                        Cash
                    </option>


                    <option value="upi">
                        UPI
                    </option>


                    <option value="credit">
                        Credit (Khata)
                    </option>

                </select>

            </div>



            <!-- CUSTOMER -->

            <div class="form-group" id="customerGroup" style="display: none;">

                <label for="customerSearch">
                    Search Customer
                </label>

                <input type="text" id="customerSearch" placeholder="🔍 Search customer by name or mobile..."
                    autocomplete="off">


                <label for="customerSelect">
                    Customer
                </label>


                <select id="customerSelect">

                    <option value="">
                        Select Customer
                    </option>

                </select>

            </div>



            <!-- =================================================
         TOTAL
    ================================================== -->

            <div class="total-card">

                <h2>
                    Grand Total:
                    ₹<span id="grandTotal">0.00</span>
                </h2>


                <button class="add-btn" onclick="checkout()">
                    🧾 Generate Bill
                </button>

            </div>


    </main>



    <!-- =====================================================
     JAVASCRIPT
===================================================== -->

    <script src="js/billing.js?v=4"></script>


<script>
document.getElementById("logoutBtn")?.addEventListener("click", async () => {
    if (!confirm("Are you sure you want to log out?")) return;

    try {
        const response = await fetch("/auth/logout", {
            method: "POST",
            credentials: "same-origin"
        });

        const result = await response.json();

        if (response.ok && result.success) {
            window.location.replace("/login.html");
        } else {
            alert(result.message || "Unable to log out.");
        }
    } catch (error) {
        alert("Unable to connect to the server. Please try again.");
    }
});
</script>

</body>

</html>
