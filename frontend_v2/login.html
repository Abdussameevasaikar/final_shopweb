
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VASAIKAR BAKALA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5fb;
            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(23, 32, 51, 0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand .icon {
            font-size: 42px;
        }

        .brand h1 {
            margin: 12px 0 8px;
            font-size: 25px;
            color: #1d293b;
        }

        .brand p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93b4ff;
            border-color: #315fc4;
        }

        .password-row {
            display: flex;
            gap: 8px;
        }

        .password-row input {
            flex: 1;
            min-width: 0;
        }

        .show-password {
            padding: 0 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #f8fafc;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2457c5;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1946a8;
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .message {
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            color: #b42318;
        }

        .message.success {
            color: #187345;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="brand">
            <div class="icon">🏪</div>
            <h1>VASAIKAR BAKALA</h1>
            <p>Grocery Store Management System</p>
        </div>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                maxlength="100"
                required
            >

            <label for="password">Password</label>
            <div class="password-row">
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
                <button
                    type="button"
                    class="show-password"
                    id="togglePassword"
                >Show</button>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Login
            </button>

            <div
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            ></div>
        </form>

        <div class="footer">
            Authorized store staff only
        </div>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        togglePassword.addEventListener("click", () => {
            const showing = passwordInput.type === "text";
            passwordInput.type = showing ? "password" : "text";
            togglePassword.textContent = showing ? "Show" : "Hide";
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "";
            message.className = "message";
            loginButton.disabled = true;
            loginButton.textContent = "Checking...";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: passwordInput.value
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Login failed.");
                }

                message.textContent = "Login successful. Opening dashboard...";
                message.className = "message success";

                window.location.href = result.redirect || "/";
            } catch (error) {
                message.textContent =
                    error.message === "Failed to fetch"
                        ? "Cannot connect to the server. Start your backend and try again."
                        : error.message;

                message.className = "message error";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
</body>
</html>
