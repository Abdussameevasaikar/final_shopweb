<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product | VASAIKAR BAKALA</title>


    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Main CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="logo">

            <i class="fa-solid fa-store"></i>

            <h2>VASAIKAR BAKALA</h2>

        </div>


        <!-- MENU -->

        <ul>


            <!-- Dashboard -->

            <li onclick="location.href='dashboard.html'">

                <i class="fa-solid fa-gauge"></i>

                Dashboard

            </li>


            <!-- Inventory -->

            <li class="active">

                <i class="fa-solid fa-boxes-stacked"></i>

                Inventory

            </li>


            <!-- Billing -->

            <li onclick="location.href='billing.html'">

                <i class="fa-solid fa-receipt"></i>

                Billing

            </li>


            <!-- Customers -->

            <li onclick="location.href='customer.html'">

                <i class="fa-solid fa-users"></i>

                Customers

            </li>


            <!-- Reports -->

            <li onclick="location.href='reports.html'">

                <i class="fa-solid fa-chart-column"></i>

                Reports

            </li>

        </ul>

    </aside>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">

            <h1>

                <i class="fa-solid fa-pen-to-square"></i>

                Edit Product

            </h1>

        </header>



        <!-- =================================================
             EDIT FORM
             ================================================= -->

        <div class="form-card">


            <form id="editForm">


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input type="text" id="name" placeholder="Enter product name" required>

                </div>



                <!-- ================= CATEGORY ================= -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input type="text" id="category" placeholder="Example: Biscuits, Rice, Soap" required>

                </div>


                <!-- ================= VARIANT / PACK ================= -->

                <div class="form-group">

                    <label for="variant">
                        Variant / Pack Size
                    </label>

                    <input type="text" id="variant" placeholder="Example: ₹5 Pack, 500g, 1kg, 1L" required>

                    <small>
                        Enter the product size or pack information.
                    </small>

                </div>


                <!-- ================= QUANTITY ================= -->

                <div class="form-group">

                    <label for="quantity">
                        Stock Quantity
                    </label>

                    <input type="number" id="quantity" min="0" step="0.001" placeholder="Enter stock quantity" required>

                </div>


                <!-- ================= UNIT ================= -->

                <div class="form-group">

                    <label for="unit">
                        Unit
                    </label>

                    <select id="unit" required>

                        <option value="piece">Piece</option>

                        <option value="kg">Kilogram (kg)</option>

                        <option value="g">Gram (g)</option>

                        <option value="liter">Liter (L)</option>

                        <option value="ml">Milliliter (ml)</option>

                    </select>

                </div>


                <!-- ================= PRICE ================= -->

                <div class="form-group">

                    <label for="price">
                        Price (₹)
                    </label>

                    <input type="number" id="price" min="0" step="0.01" placeholder="Enter price" required>

                </div>



                <!-- BUTTONS -->

                <div class="form-buttons">


                    <!-- UPDATE -->

                    <button type="submit" class="btn-primary">

                        <i class="fa-solid fa-save"></i>

                        Update Product

                    </button>



                    <!-- CANCEL -->

                    <button type="button" class="btn-secondary" onclick="location.href='inventory.html'">

                        <i class="fa-solid fa-xmark"></i>

                        Cancel

                    </button>


                </div>


            </form>


        </div>


    </main>



    <!-- =====================================================
         IMPORTANT: CORRECT JAVASCRIPT FILE
         ===================================================== -->

    <script src="js/edit_product.js"></script>


</body>

</html>
