<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Inventory | VASAIKAR BAKALA</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <div class="container">


        <!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">

        🏪

        <h2>VASAIKAR BAKALA </h2>

    </div>

    <ul>

        <li onclick="location.href='dashboard.html'">

            <i class="fa-solid fa-chart-line"></i>

            Dashboard

        </li>

        <li class="active">

            <i class="fa-solid fa-box"></i>

            Inventory

        </li>

        <li onclick="location.href='billing.html'">

            <i class="fa-solid fa-cart-shopping"></i>

            Billing

        </li>

        <li onclick="location.href='customer.html'">

            <i class="fa-solid fa-users"></i>

            Customers

        </li>

        <li onclick="location.href='reports.html'">

            <i class="fa-solid fa-chart-column"></i>

            Reports

        </li>

    </ul>

    
<button type="button" id="logoutBtn" class="logout-btn">
    <i class="fas fa-sign-out-alt"></i>
    <span>Logout</span>
</button>


</aside>


        <!-- ================= MAIN ================= -->

        <main class="main">


            <!-- HEADER -->

            <header class="header">

                <h1>
                    Inventory
                </h1>


                <button
                    class="add-btn"
                    onclick="location.href='add_product.html'">

                    <i class="fa-solid fa-plus"></i>

                    Add Product

                </button>

            </header>


            <!-- ================= TOOLBAR ================= -->

            <div class="toolbar">


                <!-- Search -->

                <input
                    type="text"
                    id="search"
                    placeholder="🔍 Search Products..."
                    onkeyup="searchItems()">


                <!-- Category -->

                <select
                    id="categoryFilter"
                    onchange="filterItems()">

                    <option value="">
                        All Categories
                    </option>

                </select>


                <!-- Sort -->

                <select
                    id="sortBy"
                    onchange="sortItems()">

                    <option value="">
                        Sort By
                    </option>

                    <option value="name">
                        Name (A-Z)
                    </option>

                    <option value="price">
                        Price (Low → High)
                    </option>

                    <option value="quantity">
                        Stock (Low → High)
                    </option>

                    <option value="category">
                        Category
                    </option>

                </select>

            </div>


            <!-- ================= INVENTORY TABLE ================= -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Product</th>

                            <th>Variant / Pack</th>

                            <th>Category</th>

                            <th>Stock</th>

                            <th>Price / Unit</th>

                            <th>Status</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="tableBody">

                        <!-- Products loaded by inventory.js -->

                    </tbody>

                </table>

            </div>


        </main>

    </div>


    <!-- ================= DELETE MODAL ================= -->

    <div
        id="deleteModal"
        class="modal">

        <div class="modal-content">


            <h2>

                <i class="fa-solid fa-trash"></i>

                Delete Product

            </h2>


            <p id="deleteText">

                Are you sure you want to delete this product?

            </p>


            <div class="modal-buttons">


                <button
                    class="action-btn delete-btn"
                    onclick="confirmDelete()">

                    Delete

                </button>


                <button
                    class="action-btn"
                    onclick="closeModal()">

                    Cancel

                </button>

            </div>


        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/inventory.js?v=2"></script>


<script>
document.getElementById("logoutBtn")?.addEventListener("click", async () => {
    if (!confirm("Are you sure you want to log out?")) return;

    try {
        const response = await fetch("/auth/logout", {
            method: "POST",
            credentials: "same-origin"
        });

        const result = await response.json();

        if (response.ok && result.success) {
            window.location.replace("/login.html");
        } else {
            alert(result.message || "Unable to log out.");
        }
    } catch (error) {
        alert("Unable to connect to the server. Please try again.");
    }
});
</script>


</body>

</html>
